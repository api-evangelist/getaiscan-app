conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '0.3.0'
  preferred_transport: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: true
  grade_basis: >-
    Graded against the A2A 1.0.0 hard checks. capabilities is an OBJECT (pass) declaring streaming false and
    pushNotifications false. protocolVersion is present at the top level (pass), declared as "0.3.0". skills is an
    ARRAY (pass) of 18 skills, each with id, name, description and tags. All three optional discriminators are
    present: preferredTransport (JSONRPC), defaultInputModes and defaultOutputModes (both application/json).
    This is a 0.3.0-shaped card — top-level url + preferredTransport + protocolVersion, with an
    additionalInterfaces[] list — and it is internally consistent with that revision.
  deviations:
  - field: payment_schemes
    observed: a top-level array that is not an A2A AgentCard field
    note: >-
      The x402 payment terms are declared as a proprietary top-level block rather than through the a2a-x402
      capabilities.extensions[] mechanism other x402 agents in the catalog use. A conformant A2A reader will
      ignore it, so the payment requirement is invisible to a strict client until it hits the 402 on the REST
      route. Recorded as an extension, not a hard failure.
  - field: skills[].x-payment-info
    observed: a vendor extension on every skill carrying price and REST endpoint
    note: Permitted as an x- extension; it is also where the card's real execution contract lives, since the A2A endpoint does not execute skills.
  - field: skills[].inputModes / outputModes / examples
    observed: absent on every skill
    note: Optional per spec; the defaults (application/json) apply.
  - field: securitySchemes / security
    observed: absent
    note: >-
      Consistent with "No API keys, no signup" — the gate is payment, not authentication. A2A has no standard
      way to express an x402 requirement without the a2a-x402 extension, which this card does not declare.
  - field: url / additionalInterfaces
    observed: the JSONRPC endpoint answers only message/send; tasks/get returns -32001 and no Task is ever created
    note: >-
      A2A's task lifecycle (tasks/get, tasks/cancel, streaming) is not implemented; message/send returns a
      Message with routing guidance rather than executing the skill. The card is conformant in shape; the
      endpoint behind it is a handoff to the REST surface. The second interface, HTTP+JSON at
      https://api.getaiscan.app, is the REST API itself, not an A2A HTTP+JSON binding.
  - field: version
    observed: card 5.9.1 vs OpenAPI 5.9.4 and 19 REST capabilities vs 18 skills
    note: See surface_drift above.
surface_relationship:
  note: >-
    AIScan publishes one execution surface and several discovery surfaces over it. Execution: the x402 REST API
    at https://api.getaiscan.app/api/agent/{capability} (20 operations in the OpenAPI, 19 paid + the free
    index). Discovery: this A2A card (18 skills), the ai-plugin.json manifest, the /.well-known/mcp.json
    descriptor (one tool, scan_website, pointing at a REST route — there is no MCP JSON-RPC server, see
    mcp/getaiscan-app-mcp.yml), the legacy agent.json descriptor, and llms.txt. Every discovery surface resolves
    to the same REST routes and the same payment wallet.
