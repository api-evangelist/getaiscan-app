    No API key, no account, no signup, no OAuth. The single securityScheme in the contract is named "x402" and
    typed apiKey-in-header only because OpenAPI has no vocabulary for a payment credential: the header
    PAYMENT-SIGNATURE carries an x402 V2 payment — either a signed EIP-3009 "exact" authorization for USDC on
