summary: >-
  AIScan publishes no rate limits. The OpenAPI declares no 429 response and no rate-limit headers; llms.txt,
  the capability index, the agent card and the descriptors say nothing about request ceilings; and the live
  unauthenticated responses (GET / and GET /api/agent/index on api.getaiscan.app, the 402 on check_health)
  carried no RateLimit-*, X-RateLimit-* or Retry-After header. The only time bound on the surface is the x402
  challenge's maxTimeoutSeconds 300 — the window to complete a payment — which is a payment deadline, not a
  rate limit. Because every call is paid, the economic price is the de facto throttle.
