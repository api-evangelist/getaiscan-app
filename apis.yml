apis:
- aid: getaiscan-app:aiscan-a2a-agent
  name: AIScan A2A Agent
  description: >-
    Agent2Agent (A2A) protocol surface: an agent card served from https://getaiscan.app/.well-known/agent-card.json
    (protocolVersion 0.3.0, JSONRPC transport, card version 5.9.1) advertising 18 skills — the same pay-per-use
    capabilities as the REST contract — each carrying an x-payment-info block with its USDC price and
    the REST endpoint that fulfils it, plus a non-standard payment_schemes[] block declaring x402 V2 on
    Base. The JSON-RPC endpoint at https://api.getaiscan.app/a2a answers message/send anonymously with
    routing guidance and rejects every other method (-32601 "Supported: message/send"); the skills themselves
    are stateless x402 HTTP calls, so an agent uses the card to discover and the REST API to execute.
  image: https://getaiscan.app/og-image.jpg
