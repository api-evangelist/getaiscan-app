apis:
- aid: getaiscan-app:aiscan-agent-api
  name: AIScan Agent API
  description: >-
    Pay-per-capability REST API for AI-visibility auditing: five cheap HTTP checks (site health and AI-crawler
    access, llms.txt, Schema.org JSON-LD, agent files, MCP discoverability), four category scores (AEO, GEO,
    Agent Readiness, MCP Readiness), a full audit, generated llms.txt / mcp.json / SKILL.md fix files, a fix
    pack, a competitor comparison, a bundled full report, and three Brand Visibility capabilities that measure
    brand mentions across 30 AI answers. Every capability is POST /api/agent/{capability} with a JSON body and
    an x402 V2 payment in the PAYMENT-SIGNATURE header (a signed payload settled through the Coinbase CDP
    facilitator, or a Base USDC transfer tx hash); an unpaid call returns HTTP 402 with the price. GET
    /api/agent/index is the free catalog. 20 operations across 20 paths, OpenAPI 3.1.0 version 5.9.4 at
    https://api.getaiscan.app/openapi.json with servers[] https://api.getaiscan.app.
  image: https://getaiscan.app/og-image.jpg
