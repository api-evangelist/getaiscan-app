aid: getaiscan-app
name: AIScan
description: >-
  AIScan is an AI-visibility auditing service at getaiscan.app that scans any website in about 60 seconds and
  returns four 0-100 scores — AEO (AI search visibility), GEO (citation readiness), Agent Readiness and MCP
  Readiness — from 80+ checks, plus a Brand Visibility measurement of how often AI assistants actually name a
  brand across 30 realistic niche prompts. Humans buy a full report on the site for 60 USDC; software agents buy
  19 individual capabilities pay-per-call (0.06-3.50 USDC) through the x402 protocol on Base (eip155:8453) with
  no API key and no account, via a 20-operation OpenAPI 3.1.0 REST contract served from api.getaiscan.app, an
  A2A 0.3.0 agent card with 18 skills at /.well-known/agent-card.json, an ai-plugin.json manifest and an MCP
  discovery descriptor at /.well-known/mcp.json. Every paid route answers an unpaid call with a real HTTP 402
  x402 V2 challenge; the capability catalog at GET /api/agent/index is free.
