summary: >-
  AIScan publishes no regulatory-posture signal of any kind. The website is a single-page app with no terms of
  service, privacy policy, refund policy, accessibility statement, subprocessor list, DPA, security page or
  transparency page — every such path returns the same 111,044-byte HTML shell with HTTP 200 (a catch-all,
  confirmed by a negative-control path), and the shell's own link list contains no legal link at all. The
  ai-plugin.json's legal_info_url points at the homepage. The only personal data the human product collects
  is an email address for report delivery and a payer wallet address; nothing published says how either is
  handled. An empty signals map is the correct measurement, not a gap in the probe.
