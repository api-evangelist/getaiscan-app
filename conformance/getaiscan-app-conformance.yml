summary: >-
  AIScan's conformance profile is the agent-commerce protocol stack: x402 V2 (HTTP 402 with a PAYMENT-REQUIRED
  header and an accepts[] payload) settled in USDC on Base (CAIP-2 eip155:8453) with EIP-3009 authorizations
  via the Coinbase CDP facilitator, an A2A 0.3.0 agent card graded conformant, JSON-RPC 2.0 on the A2A endpoint,
  OpenAPI 3.1.0, an OpenAI plugin manifest, an llms.txt and an AI-crawler-welcoming robots.txt. It declares
  no OAuth/OIDC, no RFC 9457 problem details, no RFC 9116 security.txt, no RFC 9727 API catalog, no RFC 9728
  protected-resource metadata and no RFC 8594 sunset signalling, and — despite publishing an MCP descriptor —
  runs no MCP server. Nothing here is a published compliance program (no SOC 2 / ISO 27001 / GDPR page), so no
  Compliance pointer is emitted.
standards:
- id: x402
  name: x402 HTTP payment protocol
  version: '2'
  conforms: true
  verification: observed
  domain_standard_signature: true
  evidence: >-
    POST https://api.getaiscan.app/api/agent/check_health with a JSON body and no payment returned HTTP 402
    with a PAYMENT-REQUIRED header (base64 JSON: x402Version 2, resource, accepts[{scheme exact, network
    eip155:8453, amount 60000, asset 0x8335…2913, payTo 0x0a28…a1c7, maxTimeoutSeconds 300, extra {name USD
    Coin, version 2}}]), X-Payment-Version 2 and the X-Payment-* mirrors, and a JSON body naming both flows.
    The OpenAPI declares a 402 response and an x-payment-info {price {mode fixed, currency USD, amount},
    protocols [{x402 {}}]} block on all 19 paid operations and a securityScheme named x402 in
    PAYMENT-SIGNATURE. The agent card's payment_schemes[] and every skill's x-payment-info, the ai-plugin
    description, the mcp.json authentication block, llms.txt and the API host's response headers
    (x-payment-accepted x402) all declare the same terms and wallet.
  note: >-
    This is the contract-level signature for agent commerce this market has — the payment requirement is
    machine-readable on every operation, not a prose claim — which is why domain_standard_signature is true.
    Nothing was paid; the challenge arrives before the money does.
- id: eip-3009
  name: EIP-3009 transferWithAuthorization (x402 "exact" scheme)
  conforms: true
  verification: declared
  evidence: agent card payment_schemes[0].flows[0] "exact (EIP-3009 via Coinbase CDP facilitator)"; the 402 challenge's accepts[0].scheme is "exact" with extra {name USD Coin, version 2} (the EIP-712 domain of USDC on Base).
- id: caip-2
  name: CAIP-2 chain identifier
  conforms: true
  verification: observed
  evidence: eip155:8453 in the 402 PAYMENT-REQUIRED payload, the X-Payment-Network header, the agent card, the capability index and llms.txt.
- id: a2a
  name: Agent2Agent protocol
  version: '0.3.0'
  conforms: true
  verification: observed
  evidence: >-
    a2a/getaiscan-app-agent-card.json — protocolVersion "0.3.0", url https://api.getaiscan.app/a2a,
    preferredTransport JSONRPC, capabilities object, skills[] of 18, defaultInput/OutputModes; POST
    https://api.getaiscan.app/a2a answered tasks/get with A2A error -32001 Task not found and message/send with
    a Message result. Graded conformant in a2a/getaiscan-app-a2a.yml.
  note: The endpoint implements message/send only (no task lifecycle, no streaming) and does not execute skills; execution is the REST surface. The x402 requirement is carried in a proprietary payment_schemes[] block rather than the a2a-x402 capabilities.extensions[] mechanism.
