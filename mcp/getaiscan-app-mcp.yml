tools:
- name: scan_website
  source: descriptor (/.well-known/mcp.json)
  description: >-
    Scan any website URL for AI visibility. Returns 4 scored dimensions: AEO (AI Search Visibility), GEO
    (Citation Readiness), Agent Readiness, and MCP Readiness. Each dimension includes detailed checks and fix
    instructions. Payment: pay-per-capability via x402 on Base, 0.06-1.55 USDC. Full catalog:
    https://api.getaiscan.app/api/agent/index
  input_schema:
    url: string (uri, required) — the website URL to scan
  output_schema:
    url: string
    scanned_at: string (date-time)
    overall: {score: 'integer 0-100', grade: 'enum A B C D F'}
    scores: {aeo: integer, geo: integer, agent: integer, mcp: integer}
    total_issues: integer
    categories: object
  backing_operation: openapi/getaiscan-app-openapi.json#full_audit
  cost: 0.35 USDC (full_audit price observed in the live 402 on /api/agent/scan)
