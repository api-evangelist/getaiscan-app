status_raw: descriptor published, no server — the provider serves /.well-known/mcp.json but no endpoint answers MCP JSON-RPC
source: https://getaiscan.app/.well-known/mcp.json
docs: https://getaiscan.app/llms.txt
summary: >-
  AIScan publishes an MCP DISCOVERY DESCRIPTOR, not an MCP server. https://getaiscan.app/.well-known/mcp.json
  (saved verbatim as mcp/getaiscan-app-mcp-descriptor.json) is a static manifest — schemaVersion 1.0,
  mcpVersion 1.0, vendor AIScan, capabilities {tools: true, resources: true, prompts: false}, ONE tool
  (scan_website, with a real inputSchema {url} and an outputSchema of the four scores) and ONE resource
  (https://api.getaiscan.app/api/agent/scan). Its "endpoints" are REST routes and it names no MCP transport
  URL. Every plausible endpoint was probed with an MCP tools/list JSON-RPC POST on 2026-09-19 and none is an
  MCP server: https://api.getaiscan.app/a2a answers JSON-RPC but returns -32601 "Method not found. Supported:
  message/send"; /mcp and /api/mcp on the API host return the 9-byte 404; /api/agent/mcp returns the API's own
  404 {"error":"unknown_capability", "available":[...19 capabilities...]}; /mcp and /api/mcp on the apex return
  405. The provider's llms.txt tells users to add https://getaiscan.app/.well-known/mcp.json as a "custom
  connector" in Claude Desktop and as a url in .cursor/mcp.json — that URL is a static JSON file, not a
  Streamable HTTP or SSE endpoint, so those instructions cannot produce a working MCP connection. The
  descriptor's single tool and resource both resolve to a REST route (/api/agent/scan), which the live API
  aliases to full_audit (a POST there returned the full_audit 402 challenge, 0.35 USDC). No stdio package
  exists in any registry searched (see packages/). No MCPServer pointer is emitted: the pointer would assert an
  agent-callable MCP server the provider does not run. The tool crosswalk (mcp/getaiscan-app-tool-crosswalk.yml)
  binds the declared tool to its backing OpenAPI operations so the descriptor's intent is not lost.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: none
  verified: probed
  note: >-
    mode none because nobody ships a server: the only MCP-shaped artefact is a discovery descriptor whose
    tool executes over plain HTTP with x402 payment. If AIScan later exposes a Streamable HTTP endpoint the
    payment gate would be x402 (HTTP 402 challenge, USDC on Base), not OAuth — no OAuth/OIDC metadata is served
    on either host.
