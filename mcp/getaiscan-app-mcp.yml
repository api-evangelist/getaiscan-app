  authentication:
    type: x402
    description: 'Pay per capability (0.06-1.55 USDC) on Base. x402 V2: PAYMENT-SIGNATURE signed payload or USDC tx hash.'
    steps_verbatim:
    - See capability prices at /api/agent/index, pay in USDC on Base
    - 'POST https://api.getaiscan.app/api/agent/scan?url=https://example.com'
    - 'Add header: X-Payment: <your_tx_hash>'
    - Receive full JSON report
    note: The descriptor names X-Payment; the current OpenAPI (5.9.4) and the live 402 challenge name PAYMENT-SIGNATURE. The API's CORS allow-list accepts both header spellings.
  drift: >-
    The descriptor says "0.06-1.55 USDC" and the resource description says "18 capabilities total"; the live
    index has 19 capabilities up to 3.50 USDC. The descriptor predates the visibility_* and generate_skill
    capabilities.
