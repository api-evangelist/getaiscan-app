problem_types:
- status: 402
  title: Payment required (x402 V2)
  occurrences: 19
  source_operations: [check_health, check_llms_txt, check_schema, check_agent_files, check_mcp, score_aeo, score_geo, score_agent, score_mcp, full_audit, generate_llms_txt, generate_mcp_json, fix_pack, generate_skill, compare, full_report, visibility_check, visibility_vs_competitor, visibility_fix_pack]
  causes:
  - No PAYMENT-SIGNATURE header on a paid route.
  - (Undocumented) a payment that does not verify or does not cover the capability's price.
  remediation: >-
    Read the PAYMENT-REQUIRED header (base64 JSON) or the body: pay accepts[0].amount base units of the asset to
    payTo on network eip155:8453 within maxTimeoutSeconds (300) — either sign an EIP-3009 authorization (exact
    scheme, settled via the Coinbase CDP facilitator) or send the USDC directly — and retry the identical request
    with PAYMENT-SIGNATURE set to the signed payload or the transaction hash.
  retry_safe: true — the unpaid request performed no work and consumed nothing.
